<div style="display: flex; height: 100%;">
    @if (!firstStep()) {
        <div class="divider">
            <mat-divider class="step-separator"></mat-divider>
        </div>
    }

    <div [ngClass]="{ 'step': true, 'current-step': currentStep() }" [matTooltip]="step().errorMessage || ''" [matTooltipPosition]="step().matTooltipPosition || 'above'">
        <div class="centered-step">
            <div class="step-icon">
                @if (step().status === 1) {
                    <mat-spinner [diameter]="20"></mat-spinner>
                }
                @else {
                    <mat-icon class="icon">{{ icon }}</mat-icon>
                }
            </div>
            <!--<div [ngClass]="{ 'current-step': currentStep() }">
                <div class="step-icon">
                    @if (step().status === 1) {
                        <mat-spinner [diameter]="20"></mat-spinner>
                    }
                    @else {
                        <mat-icon class="icon">{{ icon }}</mat-icon>
                    }
                </div>
            </div>-->
        </div>

        @if (step().label) {
            <span class="step-label">{{ step().label }}</span>
        }
    </div>
</div>
